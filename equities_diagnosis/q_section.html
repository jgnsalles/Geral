<style>
.qb{display:inline-block;min-width:22px;text-align:center;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
.qb.q1{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}
.qb.q2{background:color-mix(in srgb,var(--up) 9%,transparent);color:var(--ink-2)}
.qb.q3{background:color-mix(in srgb,var(--down) 9%,transparent);color:var(--ink-2)}
.qb.q4{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.qsec{margin:26px 0 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

.qtake{margin:0 0 14px;padding:12px 14px;border-left:3px solid var(--accent-ink);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5}
