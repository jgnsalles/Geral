<title>Price Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: terminal de duas camadas — barra de comando fixa (busca, arquivo, filtro), abas de função, tabela densa; a ficha da empresa abre num painel lateral */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#efede8; --ink:#16181d; --ink2:#5b6070; --rule:#dcd9d2;
  --acc:#b45309; --acc2:#0b5cad; --pos:#0f7b53; --neg:#b42318; --warn:#b45309; --hl:#fff4d6;
  --ool:#0b6e4f; --gcgr:#2e7d9a; --ebf:#1f6e8c; --cyc:#c2571a; --hr:#5b3a99; --hg:#b5338a; --exc:#9a1b3d; --top:#0f4c81; --esp:#7a5c00; --jg:#3c6e1f;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2027; --ink:#e7e9ee; --ink2:#9aa1b0; --rule:#2a2f38;
  --acc:#f5a623; --acc2:#5fa8f5; --pos:#39c38b; --neg:#ff6b6b; --warn:#f5a623; --hl:#2a2410;
  --ool:#3cc49a; --gcgr:#5cb8d6; --ebf:#6ab7d6; --cyc:#f08a4b; --hr:#a98be6; --hg:#f07cc6; --exc:#ff6b8f; --top:#6aa7e8; --esp:#e0b84a; --jg:#8fd16a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2027; --ink:#e7e9ee; --ink2:#9aa1b0; --rule:#2a2f38;
  --acc:#f5a623; --acc2:#5fa8f5; --pos:#39c38b; --neg:#ff6b6b; --warn:#f5a623; --hl:#2a2410;
  --ool:#3cc49a; --gcgr:#5cb8d6; --ebf:#6ab7d6; --cyc:#f08a4b; --hr:#a98be6; --hg:#f07cc6; --exc:#ff6b8f; --top:#6aa7e8; --esp:#e0b84a; --jg:#8fd16a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;max-width:1500px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* barra de comando */
.cmd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:2px solid var(--acc);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.brand{font-family:var(--f-num);font-weight:600;letter-spacing:.08em;color:var(--acc);font-size:14px}
.src{color:var(--ink2);font-size:12px;max-width:42ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.btn{border:1px solid var(--rule);background:var(--panel2);padding:5px 10px;border-radius:3px;font-size:12px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.search{position:relative}
.search input{width:220px;max-width:58vw;border:1px solid var(--rule);background:var(--bg);padding:5px 8px;border-radius:3px;font-family:var(--f-num)}
.sres{position:absolute;top:100%;right:0;left:0;min-width:300px;background:var(--panel);border:1px solid var(--rule);max-height:320px;overflow:auto;z-index:30}
.sres div{padding:5px 8px;cursor:pointer;display:flex;gap:8px}
.sres div:hover,.sres div.on{background:var(--hl)}
.sres b{font-family:var(--f-num);min-width:56px}
/* abas */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--rule);margin-top:10px}
.tabs button{border:0;background:none;padding:7px 12px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.sub{display:flex;gap:4px;overflow-x:auto;margin:10px 0 6px;padding-bottom:2px}
.sub button{border:1px solid var(--rule);background:var(--panel);padding:4px 9px;border-radius:2px;white-space:nowrap;font-size:12px}
.sub button.on{border-color:var(--c,var(--acc));box-shadow:inset 0 -2px 0 var(--c,var(--acc));font-weight:600}
.sub button i{font-style:normal;color:var(--ink2);font-family:var(--f-num);margin-left:4px}
/* faixa de números */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--rule);background:var(--panel);margin-top:10px}
.kpis div{padding:8px 10px;border-right:1px solid var(--rule)}
.kpis div:last-child{border-right:0}
.kpis b{display:block;font-family:var(--f-num);font-size:20px;color:var(--c,var(--ink))}
.kpis span{font-size:11px;color:var(--ink2)}
.desc{color:var(--ink2);font-size:12px;margin:2px 0 8px;max-width:110ch}
/* tabela */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--panel2);font-weight:600;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th.sorted::after{content:" ▾";color:var(--acc)}
th.sorted.asc::after{content:" ▴"}
tbody tr:hover{background:var(--hl)}
td.tk{font-family:var(--f-num);font-weight:600;color:var(--acc2);cursor:pointer}
td.click{cursor:pointer;text-decoration:underline dotted var(--ink2);text-underline-offset:3px}
td.nm{max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.ind{max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
td.w{color:var(--neg);font-weight:700;cursor:help}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.empty{padding:24px;color:var(--ink2);text-align:center}
/* ficha */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;border-left:2px solid var(--acc);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.dh h2{margin:0;font-size:18px;font-family:var(--f-num)}
.dh .meta{color:var(--ink2);font-size:12px}
.dbody{overflow:auto;padding:12px 16px;flex:1;min-width:0}
.pill{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:600;color:#fff;background:var(--c,var(--ink2))}
.tag{display:inline-block;border:1px solid var(--rule);padding:1px 6px;border-radius:2px;font-size:11px;margin:2px 4px 2px 0}
.tag.w{border-color:var(--neg);color:var(--neg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.card{border:1px solid var(--rule);padding:10px 12px;background:var(--panel);min-width:0}
.card h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--ink2)}
.kv span:nth-child(even){font-family:var(--f-num);text-align:right}
.note{font-size:11.5px;color:var(--ink2);margin:6px 0 0;max-width:90ch}
.caveat{border-left:3px solid var(--warn);background:var(--hl);padding:6px 10px;font-size:12px;margin:10px 0}
svg{display:block;width:100%;height:auto;max-width:100%}
svg text{fill:var(--ink2);font-family:var(--f-num);font-size:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,200px) 1fr 56px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.bar-row .b{height:12px;background:var(--panel2);position:relative}
.bar-row .b i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--acc2))}
.bar-row .b i.over{background:var(--neg)}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drop{position:fixed;inset:0;background:rgba(180,83,9,.15);border:3px dashed var(--acc);z-index:60;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--acc)}
.foot{margin-top:18px;color:var(--ink2);font-size:11.5px;border-top:1px solid var(--rule);padding-top:8px}
/* métodos A/B, seleção e Minha carteira */
.mb{display:inline-block;font-family:var(--f-num);font-size:10px;font-weight:600;padding:0 5px;border-radius:2px;margin-right:3px;border:1px solid var(--rule);color:var(--ink2);line-height:16px}
.mb.ab,.kv .mb.ab{background:var(--pos);border-color:var(--pos);color:#fff}
.mb.a{border-color:var(--acc);color:var(--acc)} .mb.b{border-color:var(--acc2);color:var(--acc2)}
tr.ab td{background:color-mix(in srgb,var(--pos) 9%,transparent)}
tr.ab td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
button.sel{border:0;background:none;color:var(--ink2);font-size:15px;padding:0 4px;line-height:1}
button.sel.on{color:var(--acc)}
input.wi{width:64px;text-align:right;border:1px solid var(--rule);background:var(--bg);padding:2px 4px;font-family:var(--f-num)}
.btn.x{padding:1px 6px}
.btn[disabled]{opacity:.5;cursor:default}
.h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:14px 0 4px}
svg.spk{display:inline-block;width:auto;vertical-align:middle}
@media (max-width:640px){.src{display:none}.search input{width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div style="--c:var(--pos)"><b>${P(wavg(s=>s.ret))} · ${P(wavg(s=>s.retB))}</b><span>retorno esperado A · B</span></div><div><b>${P(wavg(s=>s.rb))}</b><span>retorno no bear</span></div></div>
   ${al.length?`<div class="caveat"><b>Alertas (${al.length})</b><br>${al.slice(0,40).join('<br>')}</div>`:'<p class="desc pos">Nenhum alerta nas suas ações.</p>'}
   <div class="chips" style="margin:6px 0 10px"><input id="padd" placeholder="ticker + Enter" style="width:130px;border:1px solid var(--rule);background:var(--bg);padding:4px 6px;font-family:var(--f-num)">
    <button class="btn pri" id="prec" ${port.length?'':'disabled'}>Usar recomendado</button><button class="btn" id="peq" ${port.length?'':'disabled'}>Pesos iguais</button>
    <button class="btn" id="pcsv">Exportar CSV</button><span class="note" id="pfst">${esc(PFstat)}</span></div>
   <h3 class="h3">Carteira (${port.length})</h3>${port.length?`<div class="tw"><table>${head}<tbody>${rowsH(port.sort((a,b)=>PF.items[b].w-PF.items[a].w),false)}</tbody></table></div>`:'<div class="tw"><div class="empty">Nenhuma ação com peso. Dê um peso maior que 0 a uma ação do banco.</div></div>'}
   <h3 class="h3">Banco (${bank.length})</h3>${bank.length?`<div class="tw"><table>${head}<tbody>${rowsH(bank,true)}</tbody></table></div>`:'<div class="tw"><div class="empty">Banco vazio. Use ☆ em Ideias, na busca ou na ficha.</div></div>'}
   <p class="note">Peso 0 = banco; peso &gt; 0 = carteira. Recom. = regra da Top 20 aplicada às suas ações. Linha destacada: em 4+ das 6 carteiras do modelo.</p>
   <div class="grid2" style="margin-top:12px">
    <div class="card"><h4>Setor</h4>${barsH(grp(s=>s.sec),M.rules.capw??.4)}</div>
    <div class="card"><h4>Indústria</h4>${barsH(grp(s=>s.ind).slice(0,12))}</div>
    <div class="card"><h4>Tema IA: ${P(aiw,0)}</h4>${barsH([['IA',aiw],['Fora do tema',port.length?1-aiw:0]])}</div>
    <div class="card"><h4>Sobreposição com as carteiras do modelo</h4><div class="kv">
     <span>Top 20 · A / B / A+B</span><span>${P(tA,0)} / ${P(tB,0)} / ${P(tAB,0)}</span><span>Especiais · A / B / A+B</span><span>${P(eA,0)} / ${P(eB,0)} / ${P(eAB,0)}</span>
     <span>JG+G · A / B / A+B</span><span>${P(jA,0)} / ${P(jB,0)} / ${P(jAB,0)}</span></div></div>
   </div>`;
  const m=$('#main');m.querySelectorAll('td.tk').forEach(td=>td.onclick=()=>openStock(td.dataset.t));
  m.querySelectorAll('input[data-w]').forEach(i=>i.onchange=()=>{setW(i.dataset.w,i.value);vCarteira()});
  m.querySelectorAll('button[data-rm]').forEach(b=>b.onclick=()=>{delete PF.items[b.dataset.rm];pfChanged();vCarteira()});
  $('#prec').onclick=()=>{Object.entries(rec).forEach(([t,w])=>PF.items[t].w=Math.round(w*1000)/10);pfChanged();vCarteira()};
  $('#peq').onclick=()=>{port.forEach(t=>PF.items[t].w=Math.round(1000/port.length)/10);pfChanged();vCarteira()};
  $('#padd').onkeydown=e=>{if(e.key==='Enter'){const t=e.target.value.trim().toUpperCase();if(BY[t]&&!inPF(t)){toggleSel(t);vCarteira()}else e.target.value=''}};
  $('#pcsv').onclick=()=>{const hd=['ticker','empresa','peso_pct','peso_recomendado_pct','setor','industria','roic','cresc_A','cresc_B','ret_A','ret_B','bear','consenso','listas'];
    const q=v=>{v=v==null?'':String(v);return/[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const lines=[hd.join(',')].concat(ts.map(t=>{const s=BY[t];return[t,s.nm,PF.items[t].w||0,isN(rec[t])?(rec[t]*100).toFixed(1):'',s.sec,s.ind,s.ru,s.gc,s.gB,s.ret,s.retB,s.rb,s.cons,listNames(s).join(' | ')].map(q).join(',')}));
    saveFile('minha_carteira.csv',lines.join('\n'),'text/csv')}}
async function saveFile(name,data,type){try{const d=window.claude&&claude.use?await claude.use('downloads'):null;if(d){await d.save({filename:name,data:new Blob([data],{type})});return}}catch(e){if(e&&e.code&&e.code!=='unavailable')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function listNames(s){const o=[];LISTS.forEach(L=>{const a=inA(L,s),b=inB(L,s);if(a||b)o.push(L.n+' '+(a&&b?'A+B':a?'A':'B'))});return o}
function listTags(s){return LISTS.filter(L=>['top','esp','jg','exc'].includes(L.k)).map(L=>{const a=inA(L,s),b=inB(L,s);return a||b?`<span class="mb ${a&&b?'ab':a?'a':'b'}" title="${esc(L.n)}">${esc(L.n.replace('Top 20','T20').replace('Especiais','Esp').replace('Excepcionais','Exc'))}</span>`:''}).join('')}
const CLSCOL={[OOL]:'--ool',[GCGR]:'--gcgr',[EBF]:'--ebf','Cyclicals':'--cyc'};
function setModel(m,label){M=m;BY={};m.stocks.forEach(s=>{BY[s.t]=s});try{computeB(m)}catch(e){console.error(e)}$('#src').textContent=label||m.fonte||'';$('#src').title=$('#src').textContent;render()}
function flags(s){return s.flag?String(s.flag).split(' · ').filter(Boolean):[]}
function fxRes(m){return isN(M.fx[m])&&isN(FX_RESERVA[m])&&Math.abs(M.fx[m]-FX_RESERVA[m])<1e-6}

/* ---------- telas: Ideias e Minha carteira ---------- */
const VIEWS=[['ideias','Ideias'],['carteira','Minha carteira']];
function renderTabs(){const n=Object.keys(PF.items).length;$('#tabs').innerHTML=VIEWS.map(([k,v])=>`<button data-v="${k}" class="${VIEW===k?'on':''}">${v}${k==='carteira'&&n?` (${n})`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;ls.set('pt.view3',VIEW);render()})}
function render(){if(!M)return;if(!VIEWS.some(v=>v[0]===VIEW))VIEW='ideias';renderTabs();(VIEW==='carteira'?vCarteira:vIdeias)();renderFoot();if(CUR)openStock(CUR,true)}
function members(L){return M.stocks.filter(s=>inA(L,s)||inB(L,s))}
/* uma lista por seleção: A ∪ B; os números da linha vêm do método A quando a ação está em A, senão do B */
const VAL={w:(L,s)=>inA(L,s)?(L.w?s[L.w]:null):(L.wb?s[L.wb]:null),g:(L,s)=>inA(L,s)?s.g:s.gB,pl:(L,s)=>inA(L,s)?s.pl:s.plB,pej:(L,s)=>inA(L,s)?s.pej:s.pejB,
  ret:(L,s)=>inA(L,s)?s.ret:s.retB,m:(L,s)=>inA(L,s)&&inB(L,s)?3:inA(L,s)?2:1,sel:(L,s)=>inPF(s.t)?1:0,flag:(L,s)=>s.flag?1:0};
const val=(L,s,c)=>VAL[c]?VAL[c](L,s):s[c];
const COLS=[['','sel'],['#','i'],['Selo','m'],['Ação','t'],['Empresa','nm'],['Peso','w'],['ROIC','roic'],['Cresc.','g'],['P/L','pl'],['P/E justo','pej'],['Retorno','ret'],['⚠','flag']];
function vIdeias(){const L=LISTS.find(x=>x.k===LIST)||LISTS[0];const st=SORT[L.k];
  const nul=(x,y)=>x==null&&y==null?0:x==null?1:y==null?-1:null;
  const by=(c,asc)=>(a,b)=>{const x=val(L,a,c),y=val(L,b,c),n=nul(x,y);return n!==null?n:(typeof x==='string'?x.localeCompare(y):x-y)*(asc?1:-1)};
  const sec=by(L.w?'w':'ret',false);
  const rows=members(L).sort(st?by(st.c,st.asc):(a,b)=>(val(L,b,'m')===3)-(val(L,a,'m')===3)||sec(a,b));
  const nAB=rows.filter(s=>val(L,s,'m')===3).length,cols=COLS.filter(c=>c[1]!=='w'||L.w);
  let h=`<div class="sub">${LISTS.map(x=>`<button data-l="${x.k}" class="${x.k===L.k?'on':''}" style="--c:var(${x.c})">${x.n}<i>${members(x).length}</i></button>`).join('')}</div>
   <p class="desc">${esc(L.desc)} <span class="mb ab">A+B</span> ${nAB} no topo · A = consenso · B = histórico (o testado no backtest). Os números da linha são do método do selo.</p>`;
  if(!rows.length)h+='<div class="tw"><div class="empty">Nenhuma ação nesta lista.</div></div>';
  else{h+='<div class="tw"><table><thead><tr>'+cols.map(([n,c])=>`<th data-c="${c}" class="${['t','nm'].includes(c)?'l':''}${st&&st.c===c?' sorted'+(st.asc?' asc':''):''}">${n}</th>`).join('')+'</tr></thead><tbody>';
    rows.forEach((s,i)=>{h+=`<tr class="${val(L,s,'m')===3?'ab':''}">`+cols.map(([n,c])=>{const v=val(L,s,c);
      if(c==='sel')return`<td>${selBtn(s.t)}</td>`;if(c==='i')return`<td class="n">${i+1}</td>`;if(c==='m')return`<td class="l">${badge(L,s)}</td>`;
      if(c==='t')return`<td class="tk l" data-t="${esc(s.t)}">${esc(s.t)}</td>`;if(c==='nm')return`<td class="nm l" title="${esc(s.nm)}">${esc(s.nm)}</td>`;
      if(c==='flag')return s.flag?`<td class="w" title="${esc(s.flag)}">⚠</td>`:'<td></td>';
      if(c==='pl'||c==='pej'){const pl=val(L,s,'pl');return`<td class="n${c==='pej'&&isN(v)&&isN(pl)?(v>pl?' pos':' neg'):''}">${N(v,1)}</td>`}
      return`<td class="n${isN(v)&&v<0?' neg':''}">${P(v,c==='w'?1:0)}</td>`}).join('')+'</tr>'});
    h+='</tbody></table></div>'}
  $('#main').innerHTML=h;const m=$('#main');
  m.querySelectorAll('.sub button').forEach(b=>b.onclick=()=>{LIST=b.dataset.l;ls.set('pt.list3',LIST);vIdeias()});
  m.querySelectorAll('th').forEach(th=>th.onclick=()=>{const c=th.dataset.c;if(c==='i')return;SORT[L.k]={c,asc:st&&st.c===c?!st.asc:['t','nm'].includes(c)};vIdeias()});
  m.querySelectorAll('td.tk').forEach(td=>td.onclick=()=>openStock(td.dataset.t));wireSel(m)}

/* ---------- ficha: um painel de validação, sem abas ---------- */
function openStock(t,keep){const s=BY[t];if(!s)return;CUR=t;const d=$('#drawer');
  d.innerHTML=`<div class="dh"><div style="flex:1;min-width:0"><h2>${esc(s.t)} <span class="pill" style="--c:var(${CLSCOL[s.cls]||'--ink2'})" title="Método A (consenso)">A · ${esc(s.cls||'—')}</span> <span class="pill" style="--c:var(${CLSCOL[s.clsB]||'--ink2'})" title="Método B (histórico)">B · ${esc(s.clsB||'—')}</span></h2>
   <div class="meta">${esc(s.nm)} · ${esc(s.ind)} · US$ ${N(s.px,2)} · ${N(s.mc,0)} bi${M.adr[s.t]?` · reporta em ${esc(M.adr[s.t].moeda)}`:''}${isN(s.bag)?` · Bagger #${s.bag}`:''}</div></div>
   <span style="align-self:center">${selBtn(t)}</span><button class="btn" id="dclose" aria-label="Fechar">Esc ✕</button></div><div class="dbody" id="dbody">${fValid(s)}</div>`;
  d.hidden=false;$('#scrim').hidden=false;$('#dclose').onclick=closeStock;wireSel(d);if(!keep)$('#dbody').scrollTop=0}
function closeStock(){CUR=null;$('#drawer').hidden=true;$('#scrim').hidden=true}
function yearTable(rows,years){years=years||[];return`<div class="tw" style="margin:4px 0"><table><thead><tr><th class="l"></th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${rows.map(([n,a,f])=>`<tr><td class="l">${n}</td>${years.map((y,i)=>`<td class="n">${a&&isN(a[i])?f(a[i]):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function fValid(s){const Y=M.years,yb=Y.oi||[],yr=Y.rev||[],fin=s.fin===1;const rev=yb.map(y=>{const i=yr.indexOf(y);return i>=0&&s.rev?s.rev[i]:null}),nop=s.nop||[],ca=s.ca||[];
  const mg=yb.map((y,i)=>isN(nop[i])&&isN(rev[i])&&rev[i]>0?nop[i]/rev[i]:null),ga=yb.map((y,i)=>isN(rev[i])&&isN(ca[i])&&ca[i]>0?rev[i]/ca[i]:null),ra=mg.map((v,i)=>isN(v)&&isN(ga[i])?v*ga[i]:null);
  const up=(p,pl)=>isN(p)&&isN(pl)&&pl>0?` <span class="${p>pl?'pos':'neg'}">(${P(p/pl-1,0)})</span>`:'';
  const why=LISTS.map(L=>{const a=inA(L,s),b=inB(L,s);return`<span>${esc(L.n)}</span><span>${a||b?`<span class="mb ${a&&b?'ab':a?'a':'b'}">${a&&b?'A+B':a?'A':'B'}</span>`:'<span class="note">—</span>'}</span>`}).join('');
  return`<div class="caveat">⚠ O ROIC pode estar errado (triangulado; financeiras e seguradoras de saúde usam ROE).</div>
   ${flags(s).length?`<div style="margin-bottom:8px">${flags(s).map(x=>`<span class="tag w">⚠ ${esc(x)}</span>`).join('')}</div>`:''}
   <div class="grid2">
    <div class="card"><h4>${fin?'ROE':'ROIC'} usado: ${P(s.ru)} ${spark(fin?s.roe:s.ry,90,20,'--pos')}</h4>${fin?yearTable([['ROE',s.roe,P]],yb):
     `<div class="kv"><span>Visão do ativo</span><span>${P(s.va)}</span><span>Visão do passivo</span><span>${P(s.vp)}</span><span>Marginal (Δ NOPAT ÷ reinvestimento)</span><span>${P(s.vm)}</span></div>${yearTable([['ROIC do ano',s.ry,P]],yb)}`}</div>
    <div class="card"><h4>Margem × giro</h4>${fin?'<p class="note">Não se aplica a financeiras.</p>':yearTable([['Margem NOPAT',mg,P],['Giro do capital',ga,v=>N(v,2)+'×'],['ROIC = margem × giro',ra,P]],yb)}</div>
    <div class="card"><h4>Crescimento: A × B × patamar</h4><div class="kv"><span>A · consenso (classe)</span><span>${P(s.gc)}</span><span>A · com haircut (valuation)</span><span>${P(s.gv)}</span>
     <span>B · histórico (mediana 5 anos)</span><span>${P(s.gB)}</span><span>Patamar da indústria (p70)</span><span>${P(s.p70)}</span><span>Mediana da indústria</span><span>${P(s.gpi)}</span></div></div>
    <div class="card"><h4>P/L × P/E justo</h4><div class="tw"><table><thead><tr><th class="l"></th><th>A · consenso</th><th>B · histórico</th></tr></thead><tbody>
     <tr><td class="l">P/L</td><td class="n">${N(s.pl,1)}</td><td class="n">${N(s.plB,1)}</td></tr>
     <tr><td class="l">P/E justo</td><td class="n">${N(s.pej,1)}${up(s.pej,s.pl)}</td><td class="n">${N(s.pejB,1)}${up(s.pejB,s.plB)}</td></tr>
     <tr><td class="l">Retorno esperado</td><td class="n">${P(s.ret)}</td><td class="n">${P(s.retB)}</td></tr></tbody></table></div>
     <div class="kv" style="margin-top:6px"><span>Retorno no bear</span><span class="${isN(s.rb)&&s.rb<0?'neg':''}">${P(s.rb)}</span><span>Dividend yield</span><span>${P(s.dy)}</span></div></div>
    <div class="card"><h4>Escadinha: ${N(s.esc,0)} de 100</h4><div class="kv"><span>Receita</span><span>${spark(s.rev,120,24,'--acc2')}</span><span>Lucro operacional</span><span>${spark(s.oi,120,24,'--acc')}</span><span>EPS</span><span>${spark(s.eps,120,24,'--pos')}</span></div></div>
    <div class="card"><h4>Por que está em cada lista</h4><div class="kv">${why}</div><p class="note">Nota de boa empresa ${N(s.nota,1)} de 5.</p></div>
   </div>`}
function renderFoot(){$('#foot').innerHTML=`${M.stocks.length} ações · qualidade = ROIC ≥ 12% e crescimento ≥ 15%, sem cíclicas · A = consenso com haircut (não testado em backtest) · B = histórico (o testado) · ⚠ ROIC pode estar errado · arraste a planilha salva para atualizar`}

/* ---------- busca e teclado ---------- */
let SI=0;
function search(q){q=q.trim().toUpperCase();const r=$('#sres');if(!q){r.hidden=true;return[]}
  const a=M.stocks.filter(s=>s.t.toUpperCase().startsWith(q)).concat(M.stocks.filter(s=>!s.t.toUpperCase().startsWith(q)&&String(s.nm||'').toUpperCase().includes(q))).slice(0,12);
  SI=0;r.innerHTML=a.map((s,i)=>`<div data-t="${esc(s.t)}" class="${i===0?'on':''}"><b>${esc(s.t)}</b><span>${esc(s.nm)}</span></div>`).join('')||'<div>Nada encontrado</div>';r.hidden=false;
  r.querySelectorAll('div[data-t]').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(d.dataset.t)});return a}
function pick(t){$('#q').value='';$('#sres').hidden=true;$('#q').blur();openStock(t)}
$('#q').oninput=e=>search(e.target.value);
$('#q').onkeydown=e=>{const items=[...$('#sres').querySelectorAll('div[data-t]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;SI=(SI+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((d,i)=>d.classList.toggle('on',i===SI))}
  if(e.key==='Enter'&&items[SI])pick(items[SI].dataset.t);if(e.key==='Escape'){$('#q').value='';$('#sres').hidden=true;$('#q').blur()}};
$('#q').onblur=()=>setTimeout(()=>$('#sres').hidden=true,150);
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'&&!$('#drawer').hidden)closeStock()});
$('#scrim').onclick=closeStock;
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;ls.set('pt.theme',nx)};
{const t=ls.get('pt.theme',null);if(t)document.documentElement.dataset.theme=t}

/* ---------- carregar arquivo (botão, arrastar e IndexedDB) ---------- */
const DB={open(){return new Promise((ok,no)=>{try{const r=indexedDB.open('price-tracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})},
  async put(v){try{const d=await this.open();d.transaction('f','readwrite').objectStore('f').put(v,'last')}catch(e){}},
  async get(){try{const d=await this.open();return await new Promise(ok=>{const q=d.transaction('f').objectStore('f').get('last');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}},
  async del(){try{const d=await this.open();d.transaction('f','readwrite').objectStore('f').delete('last')}catch(e){}}};
function loadBuffer(buf,name,save){if(typeof XLSX==='undefined'){alertMsg('Não consegui carregar o leitor de planilhas (sem internet?). Os dados embutidos continuam valendo.');return}
  try{const wb=XLSX.read(buf,{type:'array'});const m=parseWorkbook(wb);if(!m.stocks.length)throw new Error('Nenhuma ação encontrada na aba Ações.');
    const when=new Date().toLocaleDateString('pt-BR');setModel(m,`${name} · carregado em ${when}`);$('#reset').hidden=false;if(save)DB.put({name,buf,when})}
  catch(e){alertMsg('Não consegui ler "'+name+'": '+e.message+' Confira se é a planilha do Price Tracker salva depois de atualizar o Wisesheets.')}}
function alertMsg(t){const d=document.createElement('div');d.className='caveat';d.textContent=t;$('#main').prepend(d)}
$('#load').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(b=>loadBuffer(b,f.name,true));e.target.value=''};
$('#reset').onclick=()=>{DB.del();$('#reset').hidden=true;setModel(EMBED)};
let dragN=0;
addEventListener('dragenter',e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){dragN++;$('#drop').hidden=false}});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;$('#drop').hidden=true}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('#drop').hidden=true;const f=e.dataTransfer.files[0];if(f)f.arrayBuffer().then(b=>loadBuffer(b,f.name,true))});

setModel(EMBED);
DB.get().then(v=>{if(v&&v.buf){const go=()=>{loadBuffer(v.buf,v.name,false);$('#src').textContent=`${v.name} · carregado em ${v.when}`};if(typeof XLSX!=='undefined')go();else addEventListener('load',go)}});
pfInit();
window.__pt={parseWorkbook,computeB,get M(){return M},get PF(){return PF}};
</script>
