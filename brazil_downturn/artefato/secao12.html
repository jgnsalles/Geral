
 <h2 class="chap" id="tri">12. Trimestre a trimestre: quem captou e quem sacou</h2>
 <figure style="border-top:0;margin-top:10px">
  <div class="ctl" style="position:static;border:0;margin:0;padding:0 0 6px"><label for="sel-q">Trimestre<select id="sel-q"></select></label><div class="now" id="tri-sum"></div></div>
  <div class="lists"><div><h4>Captaram</h4><div class="tbox" id="t-rec"></div></div><div><h4>Sacaram</h4><div class="tbox" id="t-saq"></div></div></div>
  <p class="note">Fluxo do tipo escolhido na barra, no trimestre, em R$ milhões e em % da posição desse tipo na gestora no início do trimestre ("nova" = a gestora não tinha esse investidor). Entram gestoras com ao menos R$ 1 mi desse tipo ou fluxo desse tamanho. Alpha 12m = excesso sobre o Ibovespa nos 12 meses até o início do trimestre. Também dá para chegar aqui tocando numa barra do gráfico da seção 6.</p>
  <div class="sowhat"><b>E daí</b><span>No total, umas 30 gestoras captam em cada trimestre, e as 3 maiores ficam com cerca de metade das entradas. Para PF private e varejo direto, as 3 maiores ficam com 70% a 75%: o dinheiro da pessoa física se concentra em poucas casas.</span></div>
  <div class="sowhat lens"><b>E daí: estrangeiro</b><span>Em 29 de 30 trimestres, as 3 maiores entradas estrangeiras são mais de 80% de tudo o que o estrangeiro pôs; na mediana, 98%. Só umas 6 gestoras recebem estrangeiro por trimestre. Os nomes que mais aparecem entre as 3 maiores são Tarpon (8 trimestres), Atmos (7), Principal e Plural (6) e Radar (5). Em 2026T3 entraram R$ 122 mi (Plural, Vokin e Radar fazem 97%) e saíram R$ 77 mi, quase tudo da Una.</span></div>
  <div class="sowhat lens"><b>E daí: mercado ruim</b><span>Nos 13 trimestres de queda do Ibovespa, quem mais aparece entre as 3 maiores captações do PF private é U.V. (8 trimestres), seguida de Alaska (5) e Perfin (4). No varejo direto, Studio (5), e Squadra, Alaska, Bogari e Kapitalo (3 cada). No total, nenhuma casa domina: Absoluto, Trígono, U.V. e Absolute aparecem 3 vezes cada.</span></div>
 </figure>
